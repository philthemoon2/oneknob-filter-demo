<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OneKnob Filter - PTB | Web Demo</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Display','Segoe UI',Roboto,sans-serif;
  background:#f5f5f7;
  display:flex;justify-content:center;align-items:center;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
}
.plugin{
  width:360px;
  background:linear-gradient(180deg,#ffffff 0%,#f0f0f2 100%);
  border-radius:20px;
  box-shadow:0 8px 40px rgba(0,0,0,0.12),0 2px 8px rgba(0,0,0,0.06);
  padding:28px 20px 24px;
  position:relative;
  user-select:none;
}
.title{
  text-align:center;
  font-size:22px;font-weight:700;color:#1d1d1f;
  margin-bottom:2px;
}
.subtitle{
  text-align:center;
  font-size:13px;color:#86868b;
  margin-bottom:14px;
}
.section-label{
  text-align:center;
  font-size:10px;font-weight:600;color:#86868b;
  letter-spacing:0.5px;
  margin-bottom:8px;
}
.filter-types{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:5px;
  margin-bottom:16px;
  padding:0 10px;
}
.filter-btn{
  border:none;
  border-radius:6px;
  padding:6px 0;
  font-size:12px;font-weight:500;
  cursor:pointer;
  transition:all 0.15s ease;
  background:#e8e8ed;color:#86868b;
}
.filter-btn.active{
  background:#007AFF;color:#fff;
}
.filter-btn:hover:not(.active){
  background:#d8d8dd;
}

/* Knob */
.knob-area{
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  height:220px;
  margin-bottom:4px;
}
.knob-label-left,.knob-label-right{
  position:absolute;
  font-size:11px;font-weight:600;
  color:#c7c7cc;
  transition:color 0.2s;
}
.knob-label-left{left:8px;top:50%;}
.knob-label-right{right:8px;top:50%;}
.knob-label-left.active,.knob-label-right.active{color:#007AFF}

.knob-container{
  width:200px;height:200px;
  position:relative;
  cursor:grab;
}
.knob-container:active{cursor:grabbing}
.knob-svg{width:100%;height:100%}

/* Freq display */
.freq-display{
  text-align:center;
  padding:12px 0 6px;
  cursor:pointer;
  min-height:80px;
}
.freq-value{
  font-size:42px;font-weight:700;color:#1d1d1f;
  line-height:1.1;
}
.freq-unit{
  font-size:16px;color:#86868b;
  margin-top:2px;
}
.freq-mode{
  font-size:13px;color:#007AFF;
  margin-top:4px;
  height:18px;
}

/* Divider */
.divider{
  height:0.5px;
  background:rgba(0,0,0,0.08);
  margin:8px 30px 12px;
}

/* Underwater section */
.underwater-section{
  padding:0 10px;
}
.underwater-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px;
}
.underwater-label{
  font-size:10px;font-weight:600;color:#86868b;
  letter-spacing:0.5px;
}
.underwater-sr{
  font-size:10px;font-weight:600;color:#FF9500;
  opacity:0;
  transition:opacity 0.2s;
}
.underwater-sr.visible{opacity:1}

.underwater-controls{
  display:flex;
  align-items:center;
  gap:10px;
}
.toggle-btn{
  border:none;
  border-radius:6px;
  padding:5px 12px;
  font-size:12px;font-weight:600;
  cursor:pointer;
  transition:all 0.15s ease;
  min-width:50px;
}
.toggle-btn.off{background:#e8e8ed;color:#86868b}
.toggle-btn.on{background:#FF9500;color:#fff}

.amount-slider{
  flex:1;
  -webkit-appearance:none;
  appearance:none;
  height:4px;
  border-radius:2px;
  background:#e8e8ed;
  outline:none;
}
.amount-slider::-webkit-slider-thumb{
  -webkit-appearance:none;
  width:18px;height:18px;
  border-radius:50%;
  background:#fff;
  box-shadow:0 1px 4px rgba(0,0,0,0.2);
  cursor:pointer;
}

/* Play button */
.play-section{
  text-align:center;
  margin-top:14px;
}
.play-btn{
  border:none;
  border-radius:10px;
  padding:10px 32px;
  font-size:14px;font-weight:600;
  cursor:pointer;
  transition:all 0.15s ease;
  background:#34C759;color:#fff;
}
.play-btn.playing{background:#FF3B30}
.play-btn:hover{transform:scale(1.03)}
.play-btn:active{transform:scale(0.97)}

/* Footer */
.footer{
  text-align:center;
  margin-top:16px;
}
.footer-brand{
  font-size:10px;font-weight:600;color:#86868b;
  letter-spacing:0.5px;
}
.footer-info{
  font-size:9px;color:#c7c7cc;
  margin-top:3px;
}

/* Start overlay */
.start-overlay{
  position:fixed;top:0;left:0;right:0;bottom:0;
  background:rgba(0,0,0,0.5);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  display:flex;
  justify-content:center;align-items:center;
  z-index:100;
  transition:opacity 0.3s;
}
.start-overlay.hidden{opacity:0;pointer-events:none}
.start-card{
  background:#fff;
  border-radius:16px;
  padding:40px 50px;
  text-align:center;
  box-shadow:0 20px 60px rgba(0,0,0,0.3);
}
.start-card h2{font-size:24px;color:#1d1d1f;margin-bottom:8px}
.start-card p{font-size:14px;color:#86868b;margin-bottom:24px}
.start-btn{
  border:none;border-radius:12px;
  padding:14px 40px;
  font-size:16px;font-weight:600;
  background:#007AFF;color:#fff;
  cursor:pointer;
  transition:all 0.15s ease;
}
.start-btn:hover{background:#0066d6;transform:scale(1.03)}
</style>
</head>
<body>

<div class="start-overlay" id="startOverlay">
  <div class="start-card">
    <h2>OneKnob Filter</h2>
    <p>Interactive Web Audio Demo by Phil the Beat</p>
    <button class="start-btn" id="startBtn">Start Demo</button>
  </div>
</div>

<div class="plugin">
  <div class="title">OneKnob Filter</div>
  <div class="subtitle">PTB</div>

  <div class="section-label">FILTER TYPE</div>
  <div class="filter-types" id="filterTypes">
    <button class="filter-btn active" data-type="0">Clean</button>
    <button class="filter-btn" data-type="1">Steep</button>
    <button class="filter-btn" data-type="2">Gentle</button>
    <button class="filter-btn" data-type="3">Resonant</button>
    <button class="filter-btn" data-type="4">DJ Kill</button>
    <button class="filter-btn" data-type="5">Moog</button>
  </div>

  <div class="knob-area">
    <div class="knob-label-left" id="labelHC">HIGH CUT</div>
    <div class="knob-container" id="knobContainer">
      <svg class="knob-svg" viewBox="0 0 200 200" id="knobSvg"></svg>
    </div>
    <div class="knob-label-right" id="labelLC">LOW CUT</div>
  </div>

  <div class="freq-display" id="freqDisplay">
    <div class="freq-value" id="freqValue">OFF</div>
    <div class="freq-unit" id="freqUnit"></div>
    <div class="freq-mode" id="freqMode"></div>
  </div>

  <div class="divider"></div>

  <div class="underwater-section">
    <div class="underwater-header">
      <span class="underwater-label">SAMPLE RATE</span>
      <span class="underwater-sr" id="srDisplay">16.0 kHz</span>
    </div>
    <div class="underwater-controls">
      <button class="toggle-btn off" id="dsToggle">OFF</button>
      <input type="range" class="amount-slider" id="dsAmount" min="0" max="1" step="0.01" value="0">
    </div>
  </div>

  <div class="play-section">
    <button class="play-btn" id="playBtn">&#9654; Play Loop</button>
  </div>

  <div class="footer">
    <div class="footer-brand">POWERED BY PHIL THE BEAT</div>
    <div class="footer-info">STEREO | V1.3 | WEB DEMO</div>
  </div>
</div>

// ============================================================
// STATE
// ============================================================
let audioCtx = null;
let sourceNode = null;
let audioBuffer = null;
let isPlaying = false;
let knobValue = 0; // -1 (high cut) to +1 (low cut)
let filterType = 0;
let dsOn = false;
let dsAmount = 0;

// DSP nodes
let inputGain, outputGain;
let filterNodes = []; // cascaded biquads
let underwaterWorklet = null;
let underwaterGain = null;
let postLPF = null;
let dryGain = null;
let wetGain = null;

// ============================================================
// KNOB DRAWING
// ============================================================
const knobSvg = document.getElementById('knobSvg');
const startAngle = (5 * Math.PI / 4);
const endAngle = (-Math.PI / 4);
const angleRange = 1.5 * Math.PI;

function polarToCart(cx, cy, r, angle) {
  return { x: cx + r * Math.cos(angle), y: cy + r * Math.sin(angle) };
}

function describeArc(cx, cy, r, start, end) {
  const s = polarToCart(cx, cy, r, start);
  const e = polarToCart(cx, cy, r, end);
  const sweep = end - start;
  const large = Math.abs(sweep) > Math.PI ? 1 : 0;
  const dir = sweep > 0 ? 1 : 0;
  return `M ${s.x} ${s.y} A ${r} ${r} 0 ${large} ${dir} ${e.x} ${e.y}`;
}

function drawKnob() {
  const cx = 100, cy = 100;
  const trackR = 88;
  const knobR = 58;
  const sliderPos = (knobValue + 1) / 2; // 0..1
  const angle = startAngle - sliderPos * angleRange;

  // SVG namespace
  const ns = 'http://www.w3.org/2000/svg';
  knobSvg.innerHTML = '';

  // Track background
  const track = document.createElementNS(ns, 'path');
  track.setAttribute('d', describeArc(cx, cy, trackR, startAngle, startAngle - angleRange));
  track.setAttribute('fill', 'none');
  track.setAttribute('stroke', 'rgba(0,0,0,0.08)');
  track.setAttribute('stroke-width', '3');
  track.setAttribute('stroke-linecap', 'round');
  knobSvg.appendChild(track);

  // Active arc from center
  if (Math.abs(sliderPos - 0.5) > 0.005) {
    const centerAngle = startAngle - 0.5 * angleRange;
    const active = document.createElementNS(ns, 'path');
    if (sliderPos < 0.5) {
      active.setAttribute('d', describeArc(cx, cy, trackR, angle, centerAngle));
    } else {
      active.setAttribute('d', describeArc(cx, cy, trackR, centerAngle, angle));
    }
    active.setAttribute('fill', 'none');
    active.setAttribute('stroke', '#007AFF');
    active.setAttribute('stroke-width', '3');
    active.setAttribute('stroke-linecap', 'round');
    knobSvg.appendChild(active);
  }

  // Shadow
  const shadow = document.createElementNS(ns, 'ellipse');
  shadow.setAttribute('cx', cx - 1);
  shadow.setAttribute('cy', cy + 2);
  shadow.setAttribute('rx', knobR + 1);
  shadow.setAttribute('ry', knobR + 1);
  shadow.setAttribute('fill', 'rgba(0,0,0,0.06)');
  knobSvg.appendChild(shadow);

  // Knob body gradient
  const defs = document.createElementNS(ns, 'defs');
  const grad = document.createElementNS(ns, 'linearGradient');
  grad.id = 'knobGrad';
  grad.setAttribute('x1', '0'); grad.setAttribute('y1', '0');
  grad.setAttribute('x2', '0'); grad.setAttribute('y2', '1');
  const s1 = document.createElementNS(ns, 'stop');
  s1.setAttribute('offset', '0%'); s1.setAttribute('stop-color', '#ffffff');
  const s2 = document.createElementNS(ns, 'stop');
  s2.setAttribute('offset', '100%'); s2.setAttribute('stop-color', '#f0f0f0');
  grad.appendChild(s1); grad.appendChild(s2);
  defs.appendChild(grad);
  knobSvg.appendChild(defs);

  const knob = document.createElementNS(ns, 'circle');
  knob.setAttribute('cx', cx); knob.setAttribute('cy', cy);
  knob.setAttribute('r', knobR);
  knob.setAttribute('fill', 'url(#knobGrad)');
  knob.setAttribute('stroke', 'rgba(0,0,0,0.08)');
  knob.setAttribute('stroke-width', '0.5');
  knobSvg.appendChild(knob);

  // Indicator dot
  const dotDist = knobR * 0.68;
  const dotR = 3.5;
  const dotX = cx + dotDist * Math.cos(angle);
  const dotY = cy - dotDist * Math.sin(angle);
  const dot = document.createElementNS(ns, 'circle');
  dot.setAttribute('cx', dotX); dot.setAttribute('cy', dotY);
  dot.setAttribute('r', dotR);
  dot.setAttribute('fill', '#007AFF');
  knobSvg.appendChild(dot);
}

// ============================================================
// UI UPDATES
// ============================================================
function updateUI() {
  drawKnob();

  const absVal = Math.abs(knobValue);
  const freqValEl = document.getElementById('freqValue');
  const freqUnitEl = document.getElementById('freqUnit');
  const freqModeEl = document.getElementById('freqMode');
  const labelHC = document.getElementById('labelHC');
  const labelLC = document.getElementById('labelLC');

  labelHC.classList.toggle('active', knobValue < -0.01);
  labelLC.classList.toggle('active', knobValue > 0.01);

  if (absVal <= 0.01) {
    freqValEl.textContent = 'OFF';
    freqUnitEl.textContent = '';
    freqModeEl.textContent = '';
  } else {
    let freq;
    if (knobValue < 0) freq = 20000 * Math.pow(1/20000, absVal);
    else freq = 20 * Math.pow(1000, absVal);
    freq = Math.max(1, Math.min(20000, freq));

    if (freq >= 1000) {
      freqValEl.textContent = (freq / 1000).toFixed(1);
      freqUnitEl.textContent = 'kHz';
    } else if (freq >= 10) {
      freqValEl.textContent = Math.round(freq);
      freqUnitEl.textContent = 'Hz';
    } else {
      freqValEl.textContent = freq.toFixed(1);
      freqUnitEl.textContent = 'Hz';
    }
    freqModeEl.textContent = knobValue < 0 ? 'High Cut' : 'Low Cut';
  }

  // Underwater SR display
  const srEl = document.getElementById('srDisplay');
  if (dsOn && dsAmount > 0.001) {
    const targetSR = 16000 * Math.pow(2000 / 16000, dsAmount);
    srEl.textContent = targetSR >= 1000
      ? (targetSR / 1000).toFixed(1) + ' kHz'
      : Math.round(targetSR) + ' Hz';
    srEl.classList.add('visible');
  } else {
    srEl.classList.remove('visible');
  }
}

// ============================================================
// DSP: BUILD FILTER CHAIN
// ============================================================
function getFilterStages(type) {
  // Returns { stages, Q, isMoog }
  switch(type) {
    case 0: return { stages: 1, Q: 0.707, isMoog: false };  // Clean
    case 1: return { stages: 2, Q: 0.707, isMoog: false };  // Steep
    case 2: return { stages: 1, Q: 0.5,   isMoog: false };  // Gentle (1st order approx)
    case 3: return { stages: 1, Q: 4.0,   isMoog: false };  // Resonant
    case 4: return { stages: 4, Q: 0.707, isMoog: false };  // DJ Kill
    case 5: return { stages: 4, Q: 2.5,   isMoog: true };   // Moog (high-res cascade)
    default: return { stages: 1, Q: 0.707, isMoog: false };
  }
}

function rebuildFilterChain() {
  if (!audioCtx || !inputGain) return;

  // Disconnect old chain
  try { inputGain.disconnect(); } catch(e){}
  filterNodes.forEach(n => { try { n.disconnect(); } catch(e){} });
  if (postLPF) try { postLPF.disconnect(); } catch(e){}
  if (dryGain) try { dryGain.disconnect(); } catch(e){}
  if (wetGain) try { wetGain.disconnect(); } catch(e){}

  filterNodes = [];

  const absVal = Math.abs(knobValue);
  const { stages, Q, isMoog } = getFilterStages(filterType);

  // Calculate frequency
  let freq = 0;
  let filterActive = absVal > 0.01;
  let biquadType = 'lowpass';

  if (filterActive) {
    if (knobValue < 0) {
      // High Cut (lowpass)
      freq = 20000 * Math.pow(1/20000, absVal);
      biquadType = 'lowpass';
    } else {
      // Low Cut (highpass)
      freq = 20 * Math.pow(1000, absVal);
      biquadType = 'highpass';
    }
    freq = Math.max(20, Math.min(20000, freq));
  }

  // Create filter nodes
  if (filterActive) {
    for (let i = 0; i < stages; i++) {
      const f = audioCtx.createBiquadFilter();
      f.type = biquadType;
      f.frequency.value = freq;
      f.Q.value = isMoog ? Q * (1 - i * 0.15) : Q;
      filterNodes.push(f);
    }
  }

  // Wire: inputGain -> [filters] -> underwater -> outputGain
  let lastNode = inputGain;

  if (filterNodes.length > 0) {
    lastNode.connect(filterNodes[0]);
    for (let i = 1; i < filterNodes.length; i++) {
      filterNodes[i-1].connect(filterNodes[i]);
    }
    lastNode = filterNodes[filterNodes.length - 1];
  }

  // Underwater effect path
  if (dsOn && dsAmount > 0.001 && underwaterWorklet) {
    // Dry/wet split
    dryGain = audioCtx.createGain();
    wetGain = audioCtx.createGain();
    dryGain.gain.value = 0;
    wetGain.gain.value = 1;

    // Post-decimation LP
    postLPF = audioCtx.createBiquadFilter();
    postLPF.type = 'lowpass';
    const postCutoff = 3000 * Math.pow(400 / 3000, dsAmount);
    postLPF.frequency.value = postCutoff;
    postLPF.Q.value = 1.5;

    // Second LP stage for steeper rolloff (24dB/oct)
    const postLPF2 = audioCtx.createBiquadFilter();
    postLPF2.type = 'lowpass';
    postLPF2.frequency.value = postCutoff;
    postLPF2.Q.value = 0.707;

    // Update worklet params
    if (underwaterWorklet.parameters) {
      const targetSR = 16000 * Math.pow(2000 / 16000, dsAmount);
      const phaseInc = targetSR / audioCtx.sampleRate;
      underwaterWorklet.parameters.get('phaseInc').value = phaseInc;
    }

    lastNode.connect(underwaterWorklet);
    underwaterWorklet.connect(postLPF);
    postLPF.connect(postLPF2);
    postLPF2.connect(outputGain);

    // Also dry path (bypass for comparison if needed)
    // For now, 100% wet when on
  } else {
    lastNode.connect(outputGain);
  }
}

// ============================================================
// AUDIO WORKLET: ZOH Decimation
// ============================================================
const workletCode = `
class ZOHProcessor extends AudioWorkletProcessor {
  static get parameterDescriptors() {
    return [{ name: 'phaseInc', defaultValue: 1.0, minValue: 0.01, maxValue: 1.0 }];
  }
  constructor() {
    super();
    this.phase = 0;
    this.heldL = 0;
    this.heldR = 0;
  }
  process(inputs, outputs, parameters) {
    const input = inputs[0];
    const output = outputs[0];
    if (!input || !input[0]) return true;
    const inL = input[0];
    const inR = input.length > 1 ? input[1] : input[0];
    const outL = output[0];
    const outR = output.length > 1 ? output[1] : output[0];
    const phaseInc = parameters.phaseInc.length > 1 ? parameters.phaseInc : null;
    const constPhaseInc = phaseInc === null ? parameters.phaseInc[0] : 0;

    for (let i = 0; i < outL.length; i++) {
      const inc = phaseInc ? phaseInc[i] : constPhaseInc;
      this.phase += inc;
      if (this.phase >= 1.0) {
        this.phase -= 1.0;
        this.heldL = inL[i];
        this.heldR = inR[i];
      }
      outL[i] = this.heldL;
      outR[i] = this.heldR;
    }
    return true;
  }
}
registerProcessor('zoh-processor', ZOHProcessor);
`;

// ============================================================
// INIT AUDIO
// ============================================================
async function initAudio() {
  audioCtx = new (window.AudioContext || window.webkitAudioContext)();

  // Load audio
  const raw = atob(AUDIO_B64);
  const buf = new Uint8Array(raw.length);
  for (let i = 0; i < raw.length; i++) buf[i] = raw.charCodeAt(i);
  audioBuffer = await audioCtx.decodeAudioData(buf.buffer);

  // Create worklet
  const blob = new Blob([workletCode], { type: 'application/javascript' });
  const url = URL.createObjectURL(blob);
  await audioCtx.audioWorklet.addModule(url);
  URL.revokeObjectURL(url);

  underwaterWorklet = new AudioWorkletNode(audioCtx, 'zoh-processor', {
    numberOfInputs: 1,
    numberOfOutputs: 1,
    outputChannelCount: [2]
  });

  // Master chain nodes
  inputGain = audioCtx.createGain();
  outputGain = audioCtx.createGain();
  outputGain.connect(audioCtx.destination);

  rebuildFilterChain();
}

function togglePlayback() {
  if (!audioCtx) return;

  if (isPlaying) {
    if (sourceNode) {
      sourceNode.stop();
      sourceNode = null;
    }
    isPlaying = false;
    document.getElementById('playBtn').innerHTML = '&#9654; Play Loop';
    document.getElementById('playBtn').classList.remove('playing');
  } else {
    sourceNode = audioCtx.createBufferSource();
    sourceNode.buffer = audioBuffer;
    sourceNode.loop = true;
    sourceNode.connect(inputGain);
    sourceNode.start();
    isPlaying = true;
    document.getElementById('playBtn').innerHTML = '&#9632; Stop';
    document.getElementById('playBtn').classList.add('playing');
  }
}

// ============================================================
// KNOB INTERACTION
// ============================================================
let isDragging = false;
let dragStartY = 0;
let dragStartValue = 0;

const knobContainer = document.getElementById('knobContainer');

knobContainer.addEventListener('mousedown', e => {
  isDragging = true;
  dragStartY = e.clientY;
  dragStartValue = knobValue;
  e.preventDefault();
});

knobContainer.addEventListener('touchstart', e => {
  isDragging = true;
  dragStartY = e.touches[0].clientY;
  dragStartValue = knobValue;
  e.preventDefault();
}, { passive: false });

document.addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dy = dragStartY - e.clientY;
  knobValue = Math.max(-1, Math.min(1, dragStartValue + dy / 150));
  updateUI();
  rebuildFilterChain();
});

document.addEventListener('touchmove', e => {
  if (!isDragging) return;
  const dy = dragStartY - e.touches[0].clientY;
  knobValue = Math.max(-1, Math.min(1, dragStartValue + dy / 150));
  updateUI();
  rebuildFilterChain();
}, { passive: false });

document.addEventListener('mouseup', () => { isDragging = false; });
document.addEventListener('touchend', () => { isDragging = false; });

// Double-click reset
knobContainer.addEventListener('dblclick', () => {
  knobValue = 0;
  updateUI();
  rebuildFilterChain();
});

// Click freq display to reset
document.getElementById('freqDisplay').addEventListener('click', () => {
  knobValue = 0;
  updateUI();
  rebuildFilterChain();
});

// ============================================================
// FILTER TYPE BUTTONS
// ============================================================
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    filterType = parseInt(btn.dataset.type);
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    rebuildFilterChain();
  });
});

// ============================================================
// UNDERWATER CONTROLS
// ============================================================
document.getElementById('dsToggle').addEventListener('click', () => {
  dsOn = !dsOn;
  const btn = document.getElementById('dsToggle');
  btn.textContent = dsOn ? 'ON' : 'OFF';
  btn.classList.toggle('on', dsOn);
  btn.classList.toggle('off', !dsOn);
  updateUI();
  rebuildFilterChain();
});

document.getElementById('dsAmount').addEventListener('input', e => {
  dsAmount = parseFloat(e.target.value);
  updateUI();
  rebuildFilterChain();
});

// ============================================================
// PLAY BUTTON
// ============================================================
document.getElementById('playBtn').addEventListener('click', togglePlayback);

// ============================================================
// START OVERLAY
// ============================================================
document.getElementById('startBtn').addEventListener('click', async () => {
  await initAudio();
  document.getElementById('startOverlay').classList.add('hidden');
  togglePlayback(); // Auto-start
});

// ============================================================
// INIT UI
// ============================================================
drawKnob();
updateUI();
</script>
</body>
</html>
